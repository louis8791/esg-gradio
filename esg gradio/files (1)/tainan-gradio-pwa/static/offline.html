<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>目前離線 | 台南資料</title>
<style>
  :root { --bg:#f0fdfa; --fg:#134e4a; --muted:#4b6b68; --accent:#0d9488; --card:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1f1e; --fg:#d6f5f1; --muted:#8fb3af; --accent:#2dd4bf; --card:#12302e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  .card { width: 100%; max-width: 420px; text-align: center; background: var(--card);
          border-radius: 20px; padding: 32px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .emoji { font-size: 56px; line-height: 1; }
  h1 { font-size: 1.4rem; margin: 16px 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
  button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
           background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0b1f1e; } }
</style>
</head>
<body>
  <main class="card">
    <div class="emoji">📡</div>
    <h1>目前沒有網路連線</h1>
    <p>資料需要連上網路才能下載與查詢。<br>請確認網路後再試一次。</p>
    <button onclick="location.reload()">重新載入</button>
  </main>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
